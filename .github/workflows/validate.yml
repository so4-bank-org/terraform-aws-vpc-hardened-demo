name: Terraform validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - name: Verify vendored upstream snapshot
        run: bash scripts/verify-upstream-snapshot.sh
      - name: Format wrapper and example
        run: |
          terraform fmt -check .
          terraform fmt -check examples/private
      - name: Initialize without backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate
        run: terraform validate -no-color
      - name: Mocked plan contracts and IPAM wiring
        run: python3 scripts/verify-ipam-test-plan.py
      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          version: v0.72.0
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: modules/upstream/examples,.terraform
          hide-progress: true
      - name: Scan for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.72.0
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: .terraform
          hide-progress: true
